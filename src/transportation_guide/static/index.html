<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가는 길 추천</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin-top: 1rem; font-weight: bold; }
  input { width: 100%; padding: 0.5rem; box-sizing: border-box; }
  input[type=checkbox] { width: auto; }
  label.inline { display: inline; margin-top: 0; font-weight: normal; }
  button { margin-top: 1rem; padding: 0.5rem 1rem; }
  .notice { margin-top: 1rem; padding: 0.5rem; background: #fff8e1; }
  .error { margin-top: 1rem; padding: 0.5rem; background: #fdecea; color: #b71c1c; }
  ul { list-style: none; padding: 0; }
  li { border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem; margin-top: 0.5rem; }
  .badge { background: #1565c0; color: #fff; border-radius: 4px; padding: 0 0.4rem; margin-left: 0.5rem; font-size: 0.85em; }
  .unavailable-title { margin: 1.5rem 0 0; font-size: 0.85rem; font-weight: normal; color: #757575; }
  li.route { cursor: pointer; }
  li.route.selected { border-color: #1565c0; box-shadow: 0 0 0 2px #1565c0; }
  .map-name { margin-top: 1rem; font-weight: bold; }
  .map { position: relative; width: 100%; height: 320px; overflow: hidden; background: #e0e0e0; border: 1px solid #ccc; box-sizing: border-box; margin-top: 0.5rem; }
  .map img { position: absolute; width: 256px; height: 256px; max-width: none; }
  .map svg { position: absolute; left: 0; top: 0; }
  .map-attr { font-size: 0.75rem; color: #616161; margin-top: 0.25rem; }
  .recent-title { margin: 1rem 0 0; font-size: 0.9rem; font-weight: bold; }
  #recent-list button { margin: 0.25rem 0.25rem 0 0; }
  [hidden] { display: none; }
</style>
</head>
<body>
<h1>가는 길 추천</h1>
<form id="form">
  <label for="destination">목적지 주소</label>
  <input id="destination" name="destination" required autocomplete="off">
  <div id="recent-box" hidden>
    <h2 class="recent-title">최근 목적지</h2>
    <div id="recent-list"></div>
    <button type="button" id="recent-clear">지우기</button>
  </div>
  <div id="origin-box" hidden>
    <label for="origin-address">출발지 주소</label>
    <input id="origin-address" name="origin_address" autocomplete="off">
  </div>
  <div id="access-box" hidden>
    <label for="access-code">접근 코드</label>
    <input id="access-code" name="access_code" type="password" autocomplete="off">
    <input id="show-access" type="checkbox">
    <label for="show-access" class="inline">보기</label>
  </div>
  <button type="submit" id="submit">검색</button>
</form>
<div id="location-status" class="notice" hidden></div>
<div id="busy" class="notice" role="status" hidden></div>
<div id="error" class="error" role="alert" hidden></div>
<div id="map-box" hidden>
  <div id="map-name" class="map-name"></div>
  <div id="map" class="map"></div>
  <div id="map-note" class="notice" role="status" hidden></div>
  <div class="map-attr">© OpenStreetMap contributors (<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">저작권 안내</a>)</div>
</div>
<ul id="results"></ul>
<div id="unavailable-box" hidden>
  <h2 class="unavailable-title">결과를 받지 못한 이동 수단</h2>
  <ul id="unavailable"></ul>
</div>
<script>
(function () {
  var MODE_LABELS = { walk: "도보", bike: "자전거", car: "자동차" };
  var form = document.getElementById("form");
  var originBox = document.getElementById("origin-box");
  var originInput = document.getElementById("origin-address");
  var statusBox = document.getElementById("location-status");
  var errorBox = document.getElementById("error");
  var results = document.getElementById("results");
  var unavailableList = document.getElementById("unavailable");
  var unavailableBox = document.getElementById("unavailable-box");
  var FETCH_TIMEOUT_MS = 90000;
  var WAKE_NOTICE_MS = 15000;
  var ACCESS_KEY = "transportation_guide_access_code";
  var accessBox = document.getElementById("access-box");
  var accessInput = document.getElementById("access-code");
  var showAccess = document.getElementById("show-access");
  var NON_ASCII_MESSAGE = "접근 코드에는 영문, 숫자, 기호만 쓸 수 있습니다. 키보드를 영문으로 바꿔 주세요";
  var busyBox = document.getElementById("busy");
  var wakeTimer = null;
  var submit = document.getElementById("submit");
  var position = null;

  function showOriginInput(reason) {
    statusBox.textContent = reason + " 출발지 주소를 직접 입력해 주세요.";
    statusBox.hidden = false;
    originBox.hidden = false;
  }

  function locationErrorMessage(error) {
    if (error && error.code === 1) return "현재 위치 사용이 허용되지 않았습니다.";
    if (error && error.code === 2) return "현재 위치를 알 수 없습니다.";
    if (error && error.code === 3) return "현재 위치를 가져오는 데 시간이 너무 오래 걸렸습니다.";
    return "현재 위치를 가져오지 못했습니다.";
  }

  if (navigator.geolocation) {
    statusBox.textContent = "현재 위치를 확인하는 중입니다.";
    statusBox.hidden = false;
    navigator.geolocation.getCurrentPosition(function (pos) {
      position = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      statusBox.textContent = "현재 위치를 출발지로 사용합니다.";
    }, function (error) {
      showOriginInput(locationErrorMessage(error));
    }, { timeout: 10000 });
  } else {
    showOriginInput("이 브라우저는 현재 위치를 지원하지 않습니다.");
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
  }

  showAccess.addEventListener("change", function () {
    accessInput.type = showAccess.checked ? "text" : "password";
  });

  function storedCode() {
    try { return localStorage.getItem(ACCESS_KEY) || ""; } catch (e) { return ""; }
  }

  function storeCode(code) {
    try { localStorage.setItem(ACCESS_KEY, code); } catch (e) {}
  }

  function forgetCode() {
    try { localStorage.removeItem(ACCESS_KEY); } catch (e) {}
  }

  function showBusy() {
    busyBox.textContent = "검색 중입니다.";
    busyBox.hidden = false;
    clearTimeout(wakeTimer);
    wakeTimer = setTimeout(function () {
      busyBox.textContent = "서버를 깨우는 중입니다. 최대 1분쯤 걸릴 수 있습니다.";
    }, WAKE_NOTICE_MS);
  }

  function hideBusy() {
    clearTimeout(wakeTimer);
    busyBox.hidden = true;
  }

  function formatDuration(seconds) {
    var minutes = Math.max(1, Math.round(seconds / 60));
    if (minutes < 60) return minutes + "분";
    return Math.floor(minutes / 60) + "시간 " + (minutes % 60) + "분";
  }

  function formatDistance(meters) {
    if (meters < 1000) return meters + "m";
    return (meters / 1000).toFixed(1) + "km";
  }

  var KAKAO_MODES = { car: "car", walk: "walk", bike: "bicycle" };
  var KAKAO_LINK_TEXT = "카카오맵에서 길안내";

  function kakaoPoint(place, fallbackName) {
    if (!place || !isPoint(place.lat, place.lon)) return null;
    var name = typeof place.name === "string" ? place.name.trim() : "";
    return encodeURIComponent(name || fallbackName) + "," + place.lat + "," + place.lon;
  }

  function kakaoDirectionsUrl(mode, origin, destination) {
    if (!Object.prototype.hasOwnProperty.call(KAKAO_MODES, mode)) return null;
    var from = kakaoPoint(origin, "현재 위치");
    var to = kakaoPoint(destination, "목적지");
    if (!from || !to) return null;
    return "https://map.kakao.com/link/by/" + KAKAO_MODES[mode] + "/" + from + "/" + to;
  }

  function render(routes, data) {
    results.textContent = "";
    routes.forEach(function (route) {
      var item = document.createElement("li");
      var title = document.createElement("strong");
      title.textContent = MODE_LABELS[route.mode] || route.mode;
      item.appendChild(title);
      if (route.fastest) {
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "가장 빠름";
        item.appendChild(badge);
      }
      var info = document.createElement("div");
      info.textContent = "예상 소요 시간 " + formatDuration(route.duration_seconds) +
        " · 거리 " + formatDistance(route.distance_meters);
      item.appendChild(info);
      if (route.summary) {
        var summary = document.createElement("div");
        summary.textContent = route.summary;
        item.appendChild(summary);
      }
      var kakaoUrl = data ? kakaoDirectionsUrl(route.mode, data.origin, data.destination) : null;
      if (kakaoUrl) {
        var linkLine = document.createElement("div");
        var link = document.createElement("a");
        link.href = kakaoUrl;
        link.textContent = KAKAO_LINK_TEXT;
        link.target = "_blank";
        link.rel = "noopener";
        link.addEventListener("click", function (event) { event.stopPropagation(); });
        link.addEventListener("keydown", function (event) { event.stopPropagation(); });
        linkLine.appendChild(link);
        item.appendChild(linkLine);
      }
      item.className = "route";
      item.setAttribute("data-mode", route.mode);
      item.setAttribute("tabindex", "0");
      item.setAttribute("role", "button");
      if (MODE_COLORS[route.mode]) item.style.borderLeft = "6px solid " + MODE_COLORS[route.mode];
      item.addEventListener("click", function () { selectMode(route.mode); });
      item.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectMode(route.mode);
        }
      });
      results.appendChild(item);
    });
  }

  var MODE_COLORS = { walk: "#2e7d32", bike: "#ef6c00", car: "#6a1b9a" };
  var TILE_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
  var TILE_SIZE = 256;
  var MAP_PADDING = 40;
  var SVG_NS = "http://www.w3.org/2000/svg";
  var mapBox = document.getElementById("map-box");
  var mapEl = document.getElementById("map");
  var mapNote = document.getElementById("map-note");
  var mapName = document.getElementById("map-name");
  var mapState = null;
  var selectedMode = null;

  function clearMap() {
    mapState = null;
    selectedMode = null;
    mapEl.textContent = "";
    mapEl.hidden = false;
    mapNote.textContent = "";
    mapNote.hidden = true;
    mapName.textContent = "";
    mapBox.hidden = true;
  }

  function mapMessage(text) {
    mapNote.textContent = text;
    mapNote.hidden = false;
  }

  function isPoint(lat, lon) {
    return typeof lat === "number" && typeof lon === "number" && isFinite(lat) && isFinite(lon) &&
      Math.abs(lat) <= 85 && Math.abs(lon) <= 180;
  }

  function project(lat, lon, z) {
    var scale = TILE_SIZE * Math.pow(2, z);
    var rad = lat * Math.PI / 180;
    return {
      x: (lon + 180) / 360 * scale,
      y: (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * scale
    };
  }

  function validGeometry(geometry) {
    if (!Array.isArray(geometry) || geometry.length < 2) return null;
    for (var i = 0; i < geometry.length; i++) {
      var p = geometry[i];
      if (!Array.isArray(p) || !isPoint(p[0], p[1])) return null;
    }
    return geometry;
  }

  function svgElement(name, attrs) {
    var el = document.createElementNS(SVG_NS, name);
    Object.keys(attrs).forEach(function (key) { el.setAttribute(key, attrs[key]); });
    return el;
  }

  function drawOverlay() {
    var view = mapState.view;
    var svg = mapState.svg;
    svg.textContent = "";
    function toXY(lat, lon) {
      var p = project(lat, lon, view.z);
      return { x: p.x - view.left, y: p.y - view.top };
    }
    var lines = mapState.lines.slice().sort(function (a, b) {
      return (a.mode === selectedMode ? 1 : 0) - (b.mode === selectedMode ? 1 : 0);
    });
    lines.forEach(function (line) {
      var selected = line.mode === selectedMode;
      var width = selected ? 8 : (line.fastest ? 6 : 4);
      svg.appendChild(svgElement("polyline", {
        points: line.points.map(function (p) {
          var xy = toXY(p[0], p[1]);
          return xy.x.toFixed(1) + "," + xy.y.toFixed(1);
        }).join(" "),
        fill: "none",
        stroke: MODE_COLORS[line.mode] || "#424242",
        "stroke-width": width,
        "stroke-linejoin": "round",
        "stroke-linecap": "round",
        opacity: selected ? 1 : 0.4
      }));
    });
    [[mapState.origin, "출발", "#1565c0"], [mapState.destination, "도착", "#c62828"]].forEach(function (m) {
      var xy = toXY(m[0].lat, m[0].lon);
      svg.appendChild(svgElement("circle", {
        cx: xy.x, cy: xy.y, r: 8, fill: m[2], stroke: "#fff", "stroke-width": 3
      }));
      var label = svgElement("text", {
        x: xy.x + 12, y: xy.y - 10, "font-size": 13, "font-weight": "bold", fill: m[2],
        stroke: "#fff", "stroke-width": 3, "paint-order": "stroke"
      });
      label.textContent = m[1];
      svg.appendChild(label);
    });
  }

  function drawMap() {
    var w = mapEl.clientWidth || 320;
    var h = mapEl.clientHeight || 320;
    var coords = [[mapState.origin.lat, mapState.origin.lon], [mapState.destination.lat, mapState.destination.lon]];
    mapState.lines.forEach(function (line) { coords = coords.concat(line.points); });
    var z = 17;
    var box;
    for (; z > 0; z--) {
      box = null;
      for (var i = 0; i < coords.length; i++) {
        var p = project(coords[i][0], coords[i][1], z);
        if (!box) box = { minX: p.x, maxX: p.x, minY: p.y, maxY: p.y };
        box.minX = Math.min(box.minX, p.x);
        box.maxX = Math.max(box.maxX, p.x);
        box.minY = Math.min(box.minY, p.y);
        box.maxY = Math.max(box.maxY, p.y);
      }
      if (box.maxX - box.minX <= w - 2 * MAP_PADDING && box.maxY - box.minY <= h - 2 * MAP_PADDING) break;
    }
    var left = (box.minX + box.maxX) / 2 - w / 2;
    var top = (box.minY + box.maxY) / 2 - h / 2;
    var n = Math.pow(2, z);
    mapEl.textContent = "";
    var failed = false;
    for (var tx = Math.floor(left / TILE_SIZE); tx <= Math.floor((left + w) / TILE_SIZE); tx++) {
      for (var ty = Math.floor(top / TILE_SIZE); ty <= Math.floor((top + h) / TILE_SIZE); ty++) {
        if (ty < 0 || ty >= n) continue;
        var img = document.createElement("img");
        img.alt = "";
        img.style.left = Math.round(tx * TILE_SIZE - left) + "px";
        img.style.top = Math.round(ty * TILE_SIZE - top) + "px";
        img.onerror = function () {
          if (failed) return;
          failed = true;
          mapMessage("지도 이미지를 불러오지 못했습니다. 경로 목록은 그대로 볼 수 있습니다.");
        };
        img.src = TILE_URL.replace("{z}", z).replace("{x}", ((tx % n) + n) % n).replace("{y}", ty);
        mapEl.appendChild(img);
      }
    }
    var svg = svgElement("svg", { width: w, height: h, viewBox: "0 0 " + w + " " + h });
    mapEl.appendChild(svg);
    mapState.svg = svg;
    mapState.view = { z: z, left: left, top: top };
    drawOverlay();
  }

  function selectMode(mode) {
    selectedMode = mode;
    var items = results.children;
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("selected", items[i].getAttribute("data-mode") === mode);
    }
    if (mapState && mapState.svg) {
      try { drawOverlay(); } catch (e) {}
    }
  }

  function showMap(data) {
    try {
      mapBox.hidden = false;
      mapNote.hidden = true;
      var origin = data.origin;
      var destination = data.destination;
      if (!origin || !destination || !isPoint(origin.lat, origin.lon) || !isPoint(destination.lat, destination.lon)) {
        mapEl.hidden = true;
        mapMessage("출발지나 목적지 좌표가 없어 지도를 표시하지 못했습니다.");
        return;
      }
      mapEl.hidden = false;
      mapName.textContent = "찾은 목적지: " + (destination.name || "");
      var lines = [];
      var fastestMode = null;
      data.routes.forEach(function (route) {
        if (route.fastest || (!fastestMode && fastestMode !== 0)) {
          if (route.fastest || !fastestMode) fastestMode = route.mode;
        }
        var points = validGeometry(route.geometry);
        if (points) lines.push({ mode: route.mode, fastest: !!route.fastest, points: points });
      });
      mapState = { origin: origin, destination: destination, lines: lines, svg: null, view: null };
      selectedMode = fastestMode;
      if (!lines.length) mapMessage("경로 좌표를 받지 못해 경로선은 표시하지 못했습니다.");
      drawMap();
      selectMode(fastestMode);
    } catch (e) {
      mapState = null;
      mapEl.hidden = true;
      mapBox.hidden = false;
      mapMessage("지도를 표시하지 못했습니다. 경로 목록은 그대로 볼 수 있습니다.");
    }
  }

  window.addEventListener("resize", function () {
    if (mapState && !mapBox.hidden) {
      try { drawMap(); } catch (e) {}
    }
  });

  var RECENT_KEY = "transportation_guide_recent_destinations";
  var RECENT_MAX = 10;
  var destinationInput = document.getElementById("destination");
  var recentBox = document.getElementById("recent-box");
  var recentList = document.getElementById("recent-list");
  var recentClear = document.getElementById("recent-clear");

  function readRecent() {
    try {
      var parsed = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(function (value) {
        return typeof value === "string" && value.trim() !== "";
      }).slice(0, RECENT_MAX);
    } catch (e) { return []; }
  }

  function writeRecent(list) {
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function renderRecent() {
    var list = readRecent();
    recentList.textContent = "";
    list.forEach(function (text) {
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = text;
      button.addEventListener("click", function () {
        destinationInput.value = text;
        destinationInput.focus();
      });
      recentList.appendChild(button);
    });
    recentBox.hidden = list.length === 0;
  }

  function saveRecent(text) {
    if (!text) return;
    var list = readRecent().filter(function (value) { return value !== text; });
    list.unshift(text);
    writeRecent(list.slice(0, RECENT_MAX));
    renderRecent();
  }

  recentClear.addEventListener("click", function () {
    try { localStorage.removeItem(RECENT_KEY); } catch (e) {}
    renderRecent();
  });

  renderRecent();

  function renderUnavailable(items) {
    unavailableList.textContent = "";
    items.forEach(function (entry) {
      var item = document.createElement("li");
      item.textContent = (MODE_LABELS[entry.mode] || entry.mode) + ": " + entry.reason;
      unavailableList.appendChild(item);
    });
    unavailableBox.hidden = items.length === 0;
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    errorBox.hidden = true;
    results.textContent = "";
    unavailableList.textContent = "";
    unavailableBox.hidden = true;
    clearMap();
    var body = { destination: document.getElementById("destination").value };
    var requestedDestination = body.destination.trim();
    if (position && originBox.hidden) {
      body.lat = position.lat;
      body.lon = position.lon;
    } else if (originInput.value.trim()) {
      body.origin_address = originInput.value;
    } else if (position) {
      body.lat = position.lat;
      body.lon = position.lon;
    } else {
      originBox.hidden = false;
      showError("출발지를 알 수 없습니다. 출발지 주소를 입력해 주세요.");
      return;
    }
    var code = accessInput.value.trim() || storedCode();
    if (/[^\x21-\x7e]/.test(code)) {
      accessBox.hidden = false;
      showError(NON_ASCII_MESSAGE);
      return;
    }
    submit.disabled = true;
    showBusy();
    var headers = { "Content-Type": "application/json" };
    if (code) headers["X-Access-Code"] = code;
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);
    fetch("/api/recommend", {
      method: "POST",
      headers: headers,
      body: JSON.stringify(body),
      signal: controller.signal
    }).then(function (response) {
      return response.json().then(function (data) {
        return { ok: response.ok, status: response.status, data: data };
      });
    }).then(function (result) {
      if (result.status === 401) {
        forgetCode();
        accessInput.value = "";
        showAccess.checked = false;
        accessInput.type = "password";
        accessBox.hidden = false;
        showError("접근 코드가 필요하거나 올바르지 않습니다. 접근 코드를 다시 입력해 주세요.");
        return;
      }
      if (code) storeCode(code);
      accessBox.hidden = true;
      accessInput.value = "";
      if (!result.ok) {
        showError(result.data.message || "문제가 발생했습니다. 다시 시도해 주세요.");
      } else if (!result.data.routes || !result.data.routes.length) {
        showError("표시할 경로가 없습니다. 다시 시도해 주세요.");
      } else {
        render(result.data.routes, result.data);
        saveRecent(requestedDestination);
        renderUnavailable(result.data.unavailable || []);
        showMap(result.data);
      }
    }).catch(function () {
      showError("서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.");
    }).then(function () {
      clearTimeout(timer);
      hideBusy();
      submit.disabled = false;
    });
  });
})();
</script>
</body>
</html>
